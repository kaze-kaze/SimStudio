schema_version: "1.0"
project:
  name: rectangular-cantilever-benchmark
  description: Single-body linear-static cantilever checked against Euler-Bernoulli theory.
mode: from_geometry
inputs:
  geometry_file: ./cantilever.step
units:
  length: mm
  force: N
  stress: MPa
  mass: kg
  time: s
coordinate_systems:
  - name: Global Coordinate System
    kind: global
bodies:
  - name: CantileverBeam
    material: structural_steel
materials:
  - name: structural_steel
    source: engineering_data
    engineering_data_name: Structural Steel
scopes:
  - id: fixed_face
    kind: axis_extreme_face
    body: CantileverBeam
    axis: x
    extreme: min
    tolerance: 0.001 mm
  - id: load_face
    kind: axis_extreme_face
    body: CantileverBeam
    axis: x
    extreme: max
    tolerance: 0.001 mm
analysis:
  type: linear_static_structural
  deformation: small
mesh:
  global_element_size: 10 mm
  element_order: program_controlled
supports:
  - id: fixed_support
    type: fixed_support
    scope: fixed_face
loads:
  - id: tip_force
    type: force
    scope: load_face
    components:
      x: 0 N
      y: 0 N
      z: -1000 N
requested_results:
  - id: total_deformation
    type: total_deformation
  - id: tip_z
    type: directional_deformation
    scope: load_face
    direction: z
  - id: equivalent_stress
    type: equivalent_von_mises_stress
  - id: fixed_reaction
    type: reaction_force
    support: fixed_support
  - id: solver_messages
    type: solver_messages
  - id: node_count
    type: node_count
  - id: element_count
    type: element_count
validation:
  reaction_balance_relative_tolerance: 0.05
  small_deformation_warn_ratio: 0.02
  small_deformation_fail_ratio: 0.1
  characteristic_length: 200 mm
  cantilever:
    enabled: true
    span: 200 mm
    second_moment_of_area: 106666.6666667 mm^4
    load_magnitude: 1000 N
    youngs_modulus: 200 GPa
    result_id: tip_z
    relative_tolerance: 0.15
assumptions:
  - text: Euler-Bernoulli beam theory is an approximate benchmark for this slenderness and mesh.
    source: engineering_default
  - text: The generated STEP import preserves the exact body name CantileverBeam.
    source: program
open_questions: []
output:
  export_images: true
  save_project: true
execution:
  backend: pymechanical_remote
  host: 127.0.0.1
  allow_remote: false
  transport_mode: insecure
  start_instance: auto
  timeout_seconds: 1800
  cleanup_owned_instance: true
