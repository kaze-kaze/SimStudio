name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANSYS_AVAILABLE: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os,tomllib; assert os.environ['RELEASE_TAG'] == 'v'+tomllib.load(open('pyproject.toml','rb'))['project']['version']"
      - run: ruff check .
      - run: pytest -q -m "not ansys_integration"
      - run: python tools/export_benchmark_evidence.py
      - run: python tools/build_site.py --out build/site
      - run: python -m build --no-isolation
      - run: python tools/package_release.py dist
      - run: python tools/check_distribution.py dist
      - name: Publish alpha packages and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/*-source.zip dist/SHA256SUMS \
            --verify-tag --prerelease --title "SimStudio ${RELEASE_TAG#v} · Alpha" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
