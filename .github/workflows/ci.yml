name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Offline tests
        run: pytest -q -m "not ansys_integration"
      - name: Compile example
        run: ansys-sim compile examples/cantilever/simulation.yaml --out build/ci-cantilever --json
      - name: Dry-run example
        run: ansys-sim run examples/cantilever/simulation.yaml --out build/ci-dry-run --json
