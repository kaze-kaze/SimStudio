name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ${{ matrix.os }}
    env:
      ANSYS_AVAILABLE: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Offline tests
        run: pytest -q -m "not ansys_integration"
      - name: Compile example
        run: ansys-sim compile examples/cantilever/simulation.yaml --out build/ci-cantilever --json
      - name: Dry-run example
        run: ansys-sim run examples/cantilever/simulation.yaml --out build/ci-dry-run --json
      - name: Verify public benchmark evidence
        run: python tools/export_benchmark_evidence.py
      - name: Build and validate public site
        run: python tools/build_site.py --out build/site
      - name: Build source and CLI packages
        run: python -m build --no-isolation
      - name: Check public package contents
        run: python tools/check_distribution.py dist
